name: CI Pipeline

on:
  push:
    branches: [ main, master, feature/** ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Python Syntax & Critical Lint Check
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend api tests --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Backend Integration & API Tests
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'mock_test_key' }}
          HINDSIGHT_API_KEY: ${{ secrets.HINDSIGHT_API_KEY || 'mock_test_key' }}
          HINDSIGHT_BASE_URL: https://api.hindsight.vectorize.io
          HINDSIGHT_BANK_ID: Demo
          LLM_PRIMARY_MODEL: openai/gpt-oss-120b
          LLM_FALLBACK_MODEL: qwen/qwen3-32b
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  frontend-build:
    name: Frontend Dependencies & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend Application
        working-directory: ./frontend
        run: npm run build

  docker-lint:
    name: Dockerfile & Container Sanity Check
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Dockerfiles Syntax
        run: |
          docker build -t support-copilot-backend:test -f Dockerfile.backend .
          docker build -t support-copilot-frontend:test -f Dockerfile.frontend .
